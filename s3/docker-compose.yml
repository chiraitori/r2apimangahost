services:
  rustfs-permissions:
    image: alpine:3.22
    container_name: r18-rustfs-permissions
    restart: "no"
    volumes:
      - ./rustfs-data:/data
      - ./rustfs-logs:/logs
    command: ["sh", "-c", "chown -R 10001:10001 /data /logs"]

  rustfs:
    image: rustfs/rustfs:latest
    container_name: r18-rustfs
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    env_file:
      - rustfs.env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    command: ["/data"]
    volumes:
      - ./rustfs-data:/data
      - ./rustfs-logs:/logs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - r18_storage
      - npm
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  rustfs-init:
    image: quay.io/minio/mc:latest
    container_name: r18-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    env_file:
      - rustfs.env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        mc mb --ignore-existing local/r18-manga
        mc anonymous set download local/r18-manga
    networks:
      - r18_storage

networks:
  r18_storage:
  npm:
    external: true
    name: nginxproxymanager_npm_fixed_net
