# Temporary HTTP bootstrap for r18.rinka.id.vn.
# Replace this file with the TLS version after certbot issues the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name r18.rinka.id.vn;

    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;

    client_max_body_size 600m;

    location / {
        proxy_pass http://172.17.0.1:4738;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
