server {
    listen 80;
    listen [::]:80;
    server_name r18.rinka.id.vn;

    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name r18.rinka.id.vn;

    ssl_certificate /etc/letsencrypt/live/r18.rinka.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/r18.rinka.id.vn/privkey.pem;

    client_max_body_size 600m;

    # Public object URLs generated by the API.
    location /r18-manga/ {
        proxy_pass http://r18-rustfs:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # R18 MangaHost API.
    location / {
        proxy_pass http://172.17.0.1:4738;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
